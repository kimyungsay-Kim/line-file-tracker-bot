services:
  - type: web
    name: line-file-tracker-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: OWNER_USER_ID
        sync: false
      - key: TAGGED_USER_IDS
        sync: false
      - key: PM_MODE_GROUP_IDS
        sync: false
      - key: DIGEST_HOUR
        value: "18"
      - key: DIGEST_MINUTE
        value: "0"
      - key: OVERDUE_HOUR
        value: "8"
      - key: OVERDUE_MINUTE
        value: "0"
      - key: REMIND_HOUR
        value: "9"
      - key: REMIND_MINUTE
        value: "0"
      - key: REMIND_DAYS_OF_WEEK
        value: mon-sat
      - key: TAG_LOOKBACK_MINUTES
        value: "30"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: INSPECTION_TARGET_GROUP_ID
        sync: false
      - key: REPORT_ACCESS_KEY
        sync: false
      - key: SERVICE_BASE_URL
        value: https://line-file-tracker-bot.onrender.com
